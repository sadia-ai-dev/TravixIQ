<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { 
              // Ignore assignment to avoid 'Cannot set property fetch of #<Window> which has only a getter'
              console.warn("Intercepted and ignored assignment to window.fetch");
            },
            configurable: true
          });
        } catch (e) {
          // Ignore if property is non-configurable
        }
      })();
    </script>
